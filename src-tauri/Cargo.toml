[package]
name = "tone-app"
version = "0.1.0"
edition = "2021"

[lib]
name = "tone_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
wgpu = "22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
image = "0.25"
libheif-rs = "=1.0.2"
kamadak-exif = "0.5"
